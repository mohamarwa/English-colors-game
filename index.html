<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        #color-box {
            width: 150px;
            height: 150px;
            margin: 0 auto 30px auto;
            border-radius: 15px;
            border: 3px solid #ccc; /* لإظهار اللون الأبيض بوضوح */
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #message {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            min-height: 25px;
        }
        #score-board {
            margin-top: 20px;
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Guess the Color</h1>
        <div id="color-box"></div>
        <div class="options" id="options">
            <!-- سيتم إضافة الأزرار هنا بواسطة الجافاسكربت -->
        </div>
        <div id="message"></div>
        <div id="score-board">Score: <span id="score">0</span></div>
    </div>

    <script>
        const colors = ["Red", "Green", "Yellow", "Orange", "Purple", "White", "Black", "Blue"];
        let targetColor = "";
        let score = 0;

        function initGame() {
            // مسح الرسالة
            document.getElementById('message').innerText = "";
            
            // اختيار لون عشوائي ليكون الهدف
            targetColor = colors[Math.floor(Math.random() * colors.length)];
            document.getElementById('color-box').style.backgroundColor = targetColor;

            // إنشاء قائمة الخيارات (تتضمن الإجابة الصحيحة و3 إجابات خاطئة)
            let currentOptions = [targetColor];
            while(currentOptions.length < 4) {
                let randomColor = colors[Math.floor(Math.random() * colors.length)];
                if(!currentOptions.includes(randomColor)) {
                    currentOptions.push(randomColor);
                }
            }

            // خلط الخيارات عشوائياً
            currentOptions.sort(() => Math.random() - 0.5);

            // عرض الأزرار
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = "";
            currentOptions.forEach(color => {
                let btn = document.createElement('button');
                btn.innerText = color;
                btn.onclick = () => checkAnswer(color);
                optionsDiv.appendChild(btn);
            });
        }
